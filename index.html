<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UOB IT PMO — Kanban Board (Demo)</title>

  <!-- ============================================================
       STYLES
       Single-file demo: palette + spacing scale are CSS custom
       properties; no external fonts, no frameworks, no !important.
       ============================================================ -->
  <style>
    /* ---------- Design tokens ---------- */
    :root {
      /* Corporate blue palette */
      --blue-950: #061a33;
      --blue-900: #0a2a55;
      --blue-800: #0f3d8a;
      --blue-700: #1a4fa3;
      --blue-600: #1e5bb8;
      --blue-500: #2f6fd1;
      --blue-400: #5b93e0;
      --blue-200: #c2d7f5;
      --blue-100: #e3ecfa;
      --blue-050: #f3f7fd;

      /* Neutrals */
      --ink-900: #121c2b;
      --ink-800: #26323f;
      --ink-700: #3b4757;
      --ink-500: #64707f;
      --ink-400: #93a0af;
      --ink-300: #c6cdd6;
      --ink-200: #dfe4ea;
      --ink-100: #eef1f5;
      --ink-050: #f7f9fc;
      --surface: #ffffff;
      --page-bg: #eef1f6;

      /* Semantic / priority colours */
      --prio-critical: #b3261e;
      --prio-critical-bg: #fdecea;
      --prio-high: #a15c00;
      --prio-high-bg: #fff3de;
      --prio-medium: #1a4fa3;
      --prio-medium-bg: #e3ecfa;
      --prio-low: #5a6472;
      --prio-low-bg: #eef0f3;
      --danger: #b3261e;
      --danger-bg: #fdecea;
      --success: #17703a;
      --success-bg: #e6f5ea;
      --warning: #8a5300;
      --warning-bg: #fff3de;

      /* Type scale (modular — 11 / 12 / 13 / 14 / 16 / 18 / 22 / 28) */
      --fs-2xs: 11px;
      --fs-xs: 12px;
      --fs-sm: 13px;
      --fs-md: 14px;
      --fs-lg: 16px;
      --fs-xl: 18px;
      --fs-2xl: 22px;
      --fs-3xl: 28px;

      /* Spacing scale */
      --sp-1: 4px;
      --sp-2: 8px;
      --sp-3: 12px;
      --sp-4: 16px;
      --sp-5: 20px;
      --sp-6: 24px;
      --sp-8: 32px;

      /* Misc */
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --radius-xl: 18px;
      --shadow-xs: 0 1px 2px rgba(10, 42, 85, .06);
      --shadow-sm: 0 1px 3px rgba(10, 42, 85, .08), 0 1px 2px rgba(10, 42, 85, .04);
      --shadow-md: 0 6px 18px rgba(10, 42, 85, .10), 0 2px 6px rgba(10, 42, 85, .06);
      --shadow-lg: 0 24px 56px rgba(6, 26, 51, .28);
      --focus-ring: 0 0 0 3px rgba(47, 111, 209, .35);
      --header-h: 68px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    /* ---------- Base ---------- */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    /* Sticky filter bar must never fully cover a focused control (WCAG 2.2 AA) */
    html { scroll-padding-top: calc(var(--header-h) + var(--sp-4)); }
    body {
      font-family: var(--font);
      font-size: var(--fs-md);
      line-height: 1.45;
      color: var(--ink-900);
      background: var(--page-bg);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    h1, h2, h3, p { margin: 0; }

    /* Visible focus rings everywhere (keyboard users) */
    :focus-visible {
      outline: 2px solid var(--blue-500);
      outline-offset: 2px;
    }
    .visually-hidden {
      position: absolute; width: 1px; height: 1px; overflow: hidden;
      clip: rect(0 0 0 0); white-space: nowrap; border: 0; padding: 0; margin: -1px;
    }

    /* ---------- Buttons ---------- */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2);
      padding: var(--sp-2) var(--sp-4);
      min-height: 36px;
      border-radius: var(--radius-md);
      border: 1px solid transparent;
      font-weight: 600;
      font-size: var(--fs-md);
      line-height: 1.2;
      transition: background-color .18s ease, box-shadow .18s ease, transform .12s ease, border-color .18s ease;
    }
    .btn:active { transform: translateY(1px); }
    .btn:disabled { opacity: .6; cursor: not-allowed; transform: none; }
    .btn-primary {
      background: var(--blue-600); color: #fff;
      box-shadow: 0 1px 2px rgba(10,42,85,.24), inset 0 1px 0 rgba(255,255,255,.14);
    }
    .btn-primary:hover:not(:disabled) { background: var(--blue-700); box-shadow: var(--shadow-md); }
    .btn-on-dark {
      background: #fff; color: var(--blue-800);
      box-shadow: 0 2px 10px rgba(6, 26, 51, .28);
    }
    .btn-on-dark:hover:not(:disabled) { background: var(--blue-100); transform: translateY(-1px); }
    .btn-secondary { background: var(--surface); color: var(--ink-700); border-color: var(--ink-300); }
    .btn-secondary:hover:not(:disabled) { background: var(--ink-100); border-color: var(--ink-400); }
    .btn-sm { padding: var(--sp-1) var(--sp-3); min-height: 30px; font-size: var(--fs-xs); border-radius: var(--radius-sm); }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-danger:hover:not(:disabled) { background: #8f1e17; }
    .btn-icon {
      display: inline-flex; align-items: center; justify-content: center;
      width: 30px; height: 30px; border-radius: var(--radius-sm);
      border: 0; background: transparent; color: var(--ink-400);
      transition: background-color .18s ease, color .18s ease;
    }
    .btn-icon:hover { background: var(--danger-bg); color: var(--danger); }
    .btn-icon svg { width: 16px; height: 16px; }

    /* ---------- Header ---------- */
    .app-header {
      position: relative;
      isolation: isolate;
      background:
        radial-gradient(1100px 320px at 12% -40%, rgba(91, 147, 224, .55), transparent 70%),
        linear-gradient(135deg, var(--blue-950) 0%, var(--blue-900) 45%, var(--blue-700) 100%);
      color: #fff;
      padding: var(--sp-5) var(--sp-6) var(--sp-4);
      box-shadow: 0 1px 0 rgba(255,255,255,.06) inset, var(--shadow-md);
    }
    /* Hairline of brand colour along the bottom edge */
    .app-header::after {
      content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px;
      background: linear-gradient(90deg, var(--blue-400), var(--blue-200), var(--blue-500));
      opacity: .9;
    }
    .header-row {
      display: flex; align-items: center; justify-content: space-between;
      gap: var(--sp-4); flex-wrap: wrap;
    }
    .wordmark { display: flex; align-items: center; gap: var(--sp-3); }
    .wordmark-mark {
      width: 42px; height: 42px; border-radius: var(--radius-md);
      background: linear-gradient(160deg, rgba(255,255,255,.22), rgba(255,255,255,.08));
      border: 1px solid rgba(255,255,255,.20);
      display: grid; place-items: center;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.25);
    }
    .wordmark-mark svg { width: 22px; height: 22px; }
    .wordmark h1 { font-size: var(--fs-xl); font-weight: 700; letter-spacing: .01em; }
    .wordmark p { font-size: var(--fs-xs); color: rgba(255,255,255,.78); margin-top: 1px; }

    .summary-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(112px, 1fr));
      gap: var(--sp-2);
      margin-top: var(--sp-5);
    }
    .stat {
      position: relative; overflow: hidden;
      display: flex; flex-direction: column; gap: 2px;
      padding: var(--sp-3) var(--sp-3) var(--sp-3) var(--sp-4);
      background: rgba(255,255,255,.09);
      border: 1px solid rgba(255,255,255,.16);
      border-radius: var(--radius-md);
      transition: background-color .18s ease, border-color .18s ease;
    }
    .stat:hover { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.28); }
    /* Left accent rail keys each tile to its column colour */
    .stat::before {
      content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
      background: var(--stat-accent, rgba(255,255,255,.45));
    }
    .stat[data-stat="Total"]        { --stat-accent: #ffffff; }
    .stat[data-stat="Backlog"]      { --stat-accent: #a8b6c8; }
    .stat[data-stat="In Progress"]  { --stat-accent: var(--blue-400); }
    .stat[data-stat="Blocked"]      { --stat-accent: #f0b34a; }
    .stat[data-stat="Done"]         { --stat-accent: #4ec27c; }
    .stat[data-stat="Overdue"]      { --stat-accent: #ff8f8f; }
    .stat-label {
      font-size: var(--fs-2xs); text-transform: uppercase; letter-spacing: .08em;
      font-weight: 600; color: rgba(255,255,255,.72);
    }
    .stat-value { font-size: var(--fs-2xl); font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
    .stat-overdue .stat-value { color: #ffb3b3; }

    .demo-note {
      margin-top: var(--sp-4);
      font-size: var(--fs-xs);
      color: rgba(255,255,255,.78);
      display: flex; align-items: center; gap: var(--sp-2);
      padding: var(--sp-2) var(--sp-3);
      background: rgba(0,0,0,.16);
      border: 1px solid rgba(255,255,255,.10);
      border-radius: var(--radius-sm);
    }
    .demo-note svg { width: 14px; height: 14px; flex-shrink: 0; color: var(--blue-200); }

    /* ---------- Main / filters ---------- */
    .app-main { padding: var(--sp-5) var(--sp-6) var(--sp-8); max-width: 1680px; margin: 0 auto; }

    .filter-bar {
      position: sticky; top: var(--sp-3); z-index: 20;
      display: flex; gap: var(--sp-3); flex-wrap: wrap; align-items: flex-end;
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(8px);
      border: 1px solid var(--ink-200);
      border-radius: var(--radius-lg);
      padding: var(--sp-3) var(--sp-4);
      margin-bottom: var(--sp-5);
      box-shadow: var(--shadow-sm);
    }
    .filter-bar .field { flex: 1 1 180px; min-width: 160px; }
    .filter-bar .field-actions { display: flex; gap: var(--sp-3); align-items: center; padding-bottom: 3px; }
    .filter-count {
      font-size: var(--fs-xs); color: var(--ink-500); white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .filter-count:not(:empty) {
      padding: var(--sp-1) var(--sp-2);
      background: var(--blue-050); border: 1px solid var(--blue-100);
      border-radius: 999px; color: var(--blue-700); font-weight: 600;
    }

    /* ---------- Form fields (shared by filter bar + modal) ---------- */
    .field { display: flex; flex-direction: column; gap: var(--sp-1); }
    .field label {
      font-size: var(--fs-xs); font-weight: 600; color: var(--ink-700);
      letter-spacing: .01em;
    }
    .field label .req { color: var(--danger); margin-left: 2px; }
    .field input, .field select, .field textarea {
      width: 100%;
      padding: var(--sp-2) var(--sp-3);
      min-height: 38px;
      border: 1px solid var(--ink-300);
      border-radius: var(--radius-md);
      background: var(--surface);
      transition: border-color .18s ease, box-shadow .18s ease, background-color .18s ease;
    }
    .field input:hover, .field select:hover, .field textarea:hover { border-color: var(--ink-400); }
    .field input:focus, .field select:focus, .field textarea:focus {
      outline: none; border-color: var(--blue-500); box-shadow: var(--focus-ring);
    }
    .field textarea { min-height: 84px; resize: vertical; }
    .field.invalid input, .field.invalid select, .field.invalid textarea {
      border-color: var(--danger); background: var(--danger-bg);
    }
    .field-error { font-size: var(--fs-xs); color: var(--danger); font-weight: 600; min-height: 0; }
    .field-error:empty { display: none; }
    .field-hint { font-size: var(--fs-2xs); color: var(--ink-500); }

    /* ---------- Board ---------- */
    .board {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: var(--sp-4);
      align-items: start;
    }
    .column {
      position: relative;
      background: linear-gradient(180deg, var(--ink-050), var(--ink-100));
      border: 1px solid var(--ink-200);
      border-radius: var(--radius-lg);
      display: flex; flex-direction: column;
      min-height: 240px;
      overflow: hidden;
      transition: border-color .18s ease, background-color .18s ease, box-shadow .18s ease;
    }
    /* Colour rail across the top keys the column to its status */
    .column::before {
      content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px;
      background: var(--col-accent, var(--ink-300));
    }
    .column[data-status="Backlog"]     { --col-accent: #94a3b5; }
    .column[data-status="In Progress"] { --col-accent: var(--blue-500); }
    .column[data-status="Blocked"]     { --col-accent: #d98c00; }
    .column[data-status="Done"]        { --col-accent: var(--success); }
    .column.drop-target {
      border-color: var(--blue-500);
      background: linear-gradient(180deg, var(--blue-050), var(--blue-100));
      box-shadow: var(--focus-ring);
    }
    .column-header {
      display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2);
      padding: var(--sp-4) var(--sp-4) var(--sp-3);
      background: rgba(255,255,255,.72);
      border-bottom: 1px solid var(--ink-200);
    }
    .column-title {
      display: flex; align-items: center; gap: var(--sp-2);
      font-size: var(--fs-md); font-weight: 700; letter-spacing: .01em;
    }
    .column-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--col-accent); }
    .column-meaning { font-size: var(--fs-2xs); color: var(--ink-500); font-weight: 400; margin-top: 2px; }
    .count-badge {
      min-width: 26px; height: 24px; padding: 0 var(--sp-2);
      display: inline-grid; place-items: center;
      background: var(--surface); border: 1px solid var(--ink-200);
      border-radius: 999px; font-size: var(--fs-xs); font-weight: 700; color: var(--ink-700);
      box-shadow: var(--shadow-xs);
      font-variant-numeric: tabular-nums;
    }
    .column-body {
      display: flex; flex-direction: column; gap: var(--sp-3);
      padding: var(--sp-3);
      flex: 1;
      min-height: 120px;
    }
    .column-empty {
      color: var(--ink-500); font-size: var(--fs-xs); text-align: center;
      padding: var(--sp-6) var(--sp-3);
      border: 1px dashed var(--ink-300); border-radius: var(--radius-md);
      background: rgba(255,255,255,.5);
    }

    /* ---------- Cards ---------- */
    .card {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--ink-200);
      border-radius: var(--radius-md);
      padding: var(--sp-3) var(--sp-3) var(--sp-3) var(--sp-4);
      box-shadow: var(--shadow-sm);
      cursor: grab;
      display: flex; flex-direction: column; gap: var(--sp-2);
      transition: box-shadow .18s ease, transform .18s ease, border-color .18s ease, opacity .18s ease;
    }
    /* Priority rail — inset so it reads as part of the card, not a raw border */
    .card::before {
      content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
      border-radius: var(--radius-md) 0 0 var(--radius-md);
      background: var(--prio-accent, var(--ink-300));
    }
    .card:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
      border-color: var(--ink-300);
    }
    .card:focus-within { border-color: var(--blue-400); }
    .card.dragging { opacity: .45; cursor: grabbing; transform: rotate(1.5deg); }
    .card[data-priority="Critical"] { --prio-accent: var(--prio-critical); }
    .card[data-priority="High"]     { --prio-accent: #d98c00; }
    .card[data-priority="Medium"]   { --prio-accent: var(--blue-500); }
    .card[data-priority="Low"]      { --prio-accent: var(--ink-400); }

    .card-top { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); }
    .card-id {
      font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--ink-500);
      letter-spacing: .02em;
      background: var(--ink-050); border: 1px solid var(--ink-200);
      padding: 1px var(--sp-2); border-radius: var(--radius-sm);
    }
    .card-title {
      font-size: var(--fs-md); font-weight: 650; line-height: 1.35;
      color: var(--ink-900); overflow-wrap: anywhere;
      text-wrap: balance;
    }
    .card-project {
      display: inline-flex; align-items: center; gap: var(--sp-1);
      font-size: var(--fs-xs); color: var(--blue-700); font-weight: 600;
    }
    .card-project::before {
      content: ""; width: 5px; height: 5px; border-radius: 50%;
      background: var(--blue-400); flex-shrink: 0;
    }
    .card-desc {
      font-size: var(--fs-xs); color: var(--ink-700); line-height: 1.5;
      overflow-wrap: anywhere;
    }
    .card-tags { display: flex; flex-wrap: wrap; gap: var(--sp-1); }
    .card-meta {
      display: flex; flex-wrap: wrap; gap: var(--sp-2); align-items: center;
      font-size: var(--fs-xs); color: var(--ink-700);
      padding-top: var(--sp-1);
    }
    .card-meta .meta-item { display: inline-flex; align-items: center; gap: var(--sp-1); }
    .card-meta svg { width: 13px; height: 13px; color: var(--ink-400); }
    .card-meta .overdue-date { color: var(--danger); font-weight: 600; }
    .card-meta .overdue-date svg { color: var(--danger); }

    /* Assignee initials — an avatar without shipping an image file */
    .avatar {
      width: 22px; height: 22px; flex-shrink: 0;
      display: inline-grid; place-items: center;
      border-radius: 50%;
      font-size: var(--fs-2xs); font-weight: 700; letter-spacing: .02em;
      background: var(--av-bg, var(--ink-100));
      color: var(--av-fg, var(--ink-700));
      border: 1px solid var(--av-bd, var(--ink-200));
    }
    .avatar[data-tone="0"] { --av-bg: #e3ecfa; --av-fg: #1a4fa3; --av-bd: #c2d7f5; }
    .avatar[data-tone="1"] { --av-bg: #e6f5ea; --av-fg: #17703a; --av-bd: #c5e6d1; }
    .avatar[data-tone="2"] { --av-bg: #f3e8f7; --av-fg: #7b2d8e; --av-bd: #e2cbe9; }
    .avatar[data-tone="3"] { --av-bg: #fff3de; --av-fg: #8a5300; --av-bd: #f2ddb6; }
    .avatar[data-tone="4"] { --av-bg: #e0f2f4; --av-fg: #0f6070; --av-bd: #bfe0e5; }
    .avatar[data-tone="5"] { --av-bg: #fdecea; --av-fg: #b3261e; --av-bd: #f5cdc9; }

    .pill {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 8px; border-radius: 999px;
      font-size: var(--fs-2xs); font-weight: 700; letter-spacing: .02em; line-height: 1.5;
      white-space: nowrap;
    }
    .pill-priority[data-priority="Critical"] { background: var(--prio-critical-bg); color: var(--prio-critical); }
    .pill-priority[data-priority="High"]     { background: var(--prio-high-bg); color: var(--prio-high); }
    .pill-priority[data-priority="Medium"]   { background: var(--prio-medium-bg); color: var(--prio-medium); }
    .pill-priority[data-priority="Low"]      { background: var(--prio-low-bg); color: var(--prio-low); }
    .pill-category { background: var(--ink-050); color: var(--ink-700); border: 1px solid var(--ink-200); font-weight: 600; }
    .pill-overdue { background: var(--danger-bg); color: var(--danger); border: 1px solid #f5cdc9; }

    .card-footer {
      display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2);
      padding-top: var(--sp-2); border-top: 1px solid var(--ink-100);
    }
    .move-select {
      font-size: var(--fs-xs); padding: 5px var(--sp-2);
      border: 1px solid var(--ink-300); border-radius: var(--radius-sm);
      background: var(--surface); color: var(--ink-700); cursor: pointer;
      max-width: 100%;
      transition: border-color .18s ease, background-color .18s ease;
    }
    .move-select:hover { border-color: var(--blue-400); background: var(--blue-050); }
    .move-select:focus { outline: none; border-color: var(--blue-500); box-shadow: var(--focus-ring); }

    /* Inline delete confirmation (replaces native confirm()) */
    .delete-confirm {
      display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap;
      font-size: var(--fs-xs); font-weight: 700; color: var(--danger);
      background: var(--danger-bg); border: 1px solid #f5cdc9;
      border-radius: var(--radius-sm);
      padding: var(--sp-2);
    }

    /* ---------- Modal ---------- */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(6, 26, 51, .55);
      backdrop-filter: blur(3px);
      display: flex; align-items: flex-start; justify-content: center;
      padding: 6vh var(--sp-4);
      overflow-y: auto;
      z-index: 50;
    }
    /* Author display:flex would otherwise beat the UA [hidden] rule */
    .modal-backdrop[hidden] { display: none; }
    .modal {
      background: var(--surface);
      width: 100%; max-width: 640px;
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      animation: modal-in .2s ease-out;
    }
    @keyframes modal-in { from { opacity: 0; transform: translateY(-8px) scale(.99); } to { opacity: 1; transform: none; } }
    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: var(--sp-4) var(--sp-5);
      background: linear-gradient(135deg, var(--blue-900), var(--blue-700));
      color: #fff;
    }
    .modal-header h2 { font-size: var(--fs-lg); font-weight: 700; }
    .modal-header .btn-icon { color: rgba(255,255,255,.75); }
    .modal-header .btn-icon:hover { background: rgba(255,255,255,.16); color: #fff; }
    .modal-body { padding: var(--sp-5); }
    .form-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-4);
    }
    .form-grid .span-2 { grid-column: 1 / -1; }
    .modal-footer {
      display: flex; align-items: center; justify-content: flex-end; gap: var(--sp-2);
      padding: var(--sp-4) var(--sp-5);
      background: var(--blue-050);
      border-top: 1px solid var(--ink-200);
    }
    .form-note { font-size: var(--fs-xs); color: var(--ink-500); margin-right: auto; }

    /* ---------- Toasts ---------- */
    .toast-region {
      position: fixed; right: var(--sp-4); bottom: var(--sp-4);
      display: flex; flex-direction: column; gap: var(--sp-2);
      z-index: 60; max-width: min(360px, calc(100vw - 32px));
    }
    .toast {
      display: flex; align-items: flex-start; gap: var(--sp-2);
      padding: var(--sp-3) var(--sp-4);
      border-radius: var(--radius-md);
      background: var(--ink-900); color: #fff;
      box-shadow: var(--shadow-lg);
      font-size: var(--fs-sm);
      animation: toast-in .22s ease-out;
    }
    .toast svg { width: 16px; height: 16px; flex-shrink: 0; margin-top: 1px; }
    .toast-success { background: var(--success); }
    .toast-warning { background: var(--warning); }
    .toast-error   { background: var(--danger); }
    .toast-info    { background: var(--blue-700); }
    .toast.leaving { animation: toast-out .2s ease-in forwards; }
    @keyframes toast-in  { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes toast-out { to { opacity: 0; transform: translateY(8px); } }

    /* ---------- Responsive ---------- */
    @media (max-width: 1200px) {
      .board { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 767px) {
      .app-header { padding: var(--sp-4); }
      .app-main { padding-left: var(--sp-4); padding-right: var(--sp-4); }
      .board { grid-template-columns: 1fr; }
      .form-grid { grid-template-columns: 1fr; }
      .summary-strip { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .modal-backdrop { padding: var(--sp-3); }
      .filter-bar { position: static; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none; transition: none; }
      .card:hover { transform: none; }
      .btn-on-dark:hover:not(:disabled) { transform: none; }
    }
  </style>
</head>
<body>

  <!-- ============================================================
       HEADER: wordmark, Add Task button, live summary strip, demo note
       ============================================================ -->
  <header class="app-header">
    <div class="header-row">
      <div class="wordmark">
        <span class="wordmark-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="5" height="16" rx="1"/>
            <rect x="10" y="4" width="5" height="10" rx="1"/>
            <rect x="17" y="4" width="4" height="7" rx="1"/>
          </svg>
        </span>
        <div>
          <h1>UOB IT PMO</h1>
          <p>IT Project Management Board · internal demo</p>
        </div>
      </div>
      <button type="button" class="btn btn-on-dark" id="openAddTask">
        <span aria-hidden="true">+</span> Add Task
      </button>
    </div>

    <!-- Live summary strip (rendered by renderSummary()) -->
    <section class="summary-strip" id="summaryStrip" aria-label="Board summary"></section>

    <p class="demo-note">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      Demo mode: board state is held in memory only. Refreshing the page resets it to the seeded demo data.
    </p>
  </header>

  <!-- ============================================================
       MAIN: filter bar + Kanban board
       ============================================================ -->
  <main class="app-main">

    <!-- Filter bar (pure client-side over the in-memory array) -->
    <section class="filter-bar" aria-label="Filters">
      <div class="field">
        <label for="filterProject">Project / Workstream</label>
        <select id="filterProject">
          <option value="">All projects</option>
        </select>
      </div>
      <div class="field">
        <label for="filterAssignee">Assignee contains</label>
        <input type="text" id="filterAssignee" placeholder="e.g. Tan" autocomplete="off">
      </div>
      <div class="field">
        <label for="filterPriority">Priority</label>
        <select id="filterPriority">
          <option value="">All priorities</option>
        </select>
      </div>
      <div class="field-actions">
        <span class="filter-count" id="filterCount" aria-live="polite"></span>
        <button type="button" class="btn btn-secondary btn-sm" id="clearFilters">Clear filters</button>
      </div>
    </section>

    <!-- Kanban board: four fixed columns rendered by renderBoard() -->
    <section class="board" id="board" aria-label="Kanban board"></section>
  </main>

  <!-- ============================================================
       ADD TASK MODAL (hidden until "+ Add Task" is clicked)
       ============================================================ -->
  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <h2 id="modalTitle">Add Task</h2>
        <button type="button" class="btn-icon" id="closeAddTask" aria-label="Close add task form">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <form id="addTaskForm" novalidate>
        <div class="modal-body">
          <div class="form-grid">

            <div class="field span-2">
              <label for="fTitle">Task Title <span class="req" aria-hidden="true">*</span></label>
              <input type="text" id="fTitle" name="title" maxlength="80" required aria-describedby="eTitle">
              <span class="field-hint">Required · max 80 characters</span>
              <span class="field-error" id="eTitle" role="alert"></span>
            </div>

            <div class="field span-2">
              <label for="fDescription">Description</label>
              <textarea id="fDescription" name="description" maxlength="500" aria-describedby="eDescription"></textarea>
              <span class="field-hint">Optional · max 500 characters</span>
              <span class="field-error" id="eDescription" role="alert"></span>
            </div>

            <div class="field">
              <label for="fProject">Project / Workstream <span class="req" aria-hidden="true">*</span></label>
              <select id="fProject" name="project" aria-describedby="eProject"></select>
              <span class="field-error" id="eProject" role="alert"></span>
            </div>

            <div class="field">
              <label for="fCategory">Category <span class="req" aria-hidden="true">*</span></label>
              <select id="fCategory" name="category" aria-describedby="eCategory"></select>
              <span class="field-error" id="eCategory" role="alert"></span>
            </div>

            <div class="field">
              <label for="fAssignee">Assignee <span class="req" aria-hidden="true">*</span></label>
              <input type="text" id="fAssignee" name="assignee" required autocomplete="off" aria-describedby="eAssignee">
              <span class="field-error" id="eAssignee" role="alert"></span>
            </div>

            <div class="field">
              <label for="fPriority">Priority <span class="req" aria-hidden="true">*</span></label>
              <select id="fPriority" name="priority" aria-describedby="ePriority"></select>
              <span class="field-error" id="ePriority" role="alert"></span>
            </div>

            <div class="field">
              <label for="fDueDate">Due Date <span class="req" aria-hidden="true">*</span></label>
              <input type="date" id="fDueDate" name="dueDate" required aria-describedby="eDueDate">
              <span class="field-hint">Must not be in the past</span>
              <span class="field-error" id="eDueDate" role="alert"></span>
            </div>

            <div class="field">
              <label for="fStatus">Status <span class="req" aria-hidden="true">*</span></label>
              <select id="fStatus" name="status" aria-describedby="eStatus"></select>
              <span class="field-error" id="eStatus" role="alert"></span>
            </div>

          </div>
        </div>
        <div class="modal-footer">
          <span class="form-note">A notification email is sent via FormSubmit.</span>
          <button type="button" class="btn btn-secondary" id="cancelAddTask">Cancel</button>
          <button type="submit" class="btn btn-primary" id="submitAddTask">Add Task</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast region: announced politely to screen readers -->
  <div class="toast-region" id="toastRegion" aria-live="polite" aria-atomic="false"></div>

  <!-- ============================================================
       SCRIPT
       ============================================================ -->
  <script>
  (function () {
    "use strict";

    /* ==========================================================
       CONFIG — change the email address here (one place only).

       FormSubmit requires a ONE-TIME ACTIVATION: the first
       submission to this endpoint triggers a confirmation email
       to the address below. Notifications only start delivering
       after the link in that email has been clicked. Until then,
       requests may return a non-200 status and the app will show
       a warning toast (the board keeps working regardless).
       ========================================================== */
    const FORMSUBMIT_ENDPOINT = "https://formsubmit.co/ajax/YOUR_EMAIL@example.com";

    /* ---------- Static option lists ---------- */
    const STATUSES = ["Backlog", "In Progress", "Blocked", "Done"];
    const STATUS_MEANING = {
      "Backlog": "Logged, not yet scheduled",
      "In Progress": "Actively being worked",
      "Blocked": "Waiting on a dependency, vendor or approval",
      "Done": "Completed / closed"
    };
    const PROJECTS = [
      "Core Banking Upgrade", "Digital Channels", "Cybersecurity Uplift",
      "Data & Analytics", "Infrastructure & Cloud", "Vendor Management"
    ];
    const CATEGORIES = [
      "Application Development", "Infrastructure", "Cybersecurity",
      "Data", "Compliance", "Vendor"
    ];
    const PRIORITIES = ["Critical", "High", "Medium", "Low"];

    const TITLE_MAX = 80;
    const DESC_MAX = 500;
    const TOAST_MS = 4000;

    /* ==========================================================
       STATE — single source of truth. No persistence by design.
       ========================================================== */
    const state = {
      tasks: [],
      filters: { project: "", assignee: "", priority: "" },
      pendingDeleteId: null,   // card currently showing inline "Delete? Yes / No"
      nextIdNumber: 1          // incrementing counter for UOB-ITPM-####
    };

    /* ==========================================================
       HELPERS
       ========================================================== */

    /** Escape user-supplied strings before inserting into HTML. */
    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    /** Local calendar date as YYYY-MM-DD (avoids UTC off-by-one). */
    function toIsoDate(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function todayIso() { return toIsoDate(new Date()); }

    /** Today ± n days as YYYY-MM-DD (used to seed realistic demo dates). */
    function daysFromToday(n) {
      const d = new Date();
      d.setDate(d.getDate() + n);
      return toIsoDate(d);
    }

    /** Overdue = due date before today AND not Done. */
    function isOverdue(task) {
      return task.status !== "Done" && task.dueDate < todayIso();
    }

    /** Display date like "08 Sep 2026" from YYYY-MM-DD. */
    function formatDate(iso) {
      const [y, m, d] = iso.split("-").map(Number);
      const dt = new Date(y, m - 1, d);
      return dt.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
    }

    /** Up to two initials for the assignee avatar ("Marcus Tan" -> "MT"). */
    function initials(name) {
      const parts = name.trim().split(/\s+/).filter(Boolean);
      if (!parts.length) return "?";
      const first = parts[0][0];
      const last = parts.length > 1 ? parts[parts.length - 1][0] : "";
      return (first + last).toUpperCase();
    }

    /** Stable avatar tone 0-5 from the name, so one person keeps one colour. */
    function avatarTone(name) {
      let hash = 0;
      for (let i = 0; i < name.length; i += 1) hash = (hash * 31 + name.charCodeAt(i)) % 100000;
      return hash % 6;
    }

    /** Generate next task ID in the format UOB-ITPM-#### */
    function generateTaskId() {
      const id = `UOB-ITPM-${String(state.nextIdNumber).padStart(4, "0")}`;
      state.nextIdNumber += 1;
      return id;
    }

    function findTask(id) {
      return state.tasks.find(t => t.id === id);
    }

    /** Small inline SVG icons (no external assets). */
    const ICONS = {
      user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
      calendar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>',
      close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
      check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>',
      warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
      info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>'
    };

    /* ==========================================================
       SEED DATA — 8 realistic demo tasks across all four columns.
       Dates are relative to "today" so the overdue badge always
       has something to show.
       ========================================================== */
    function seedTasks() {
      const seed = [
        {
          title: "Migrate FX pricing service to AWS",
          description: "Lift-and-shift the FX pricing engine to the regional AWS landing zone, then cut over the pricing API behind the internal gateway.",
          project: "Infrastructure & Cloud", category: "Infrastructure",
          assignee: "Marcus Tan", priority: "High", dueDate: daysFromToday(21), status: "In Progress"
        },
        {
          title: "Patch CVE-2025-XXXX on branch teller VDI",
          description: "Roll the vendor hotfix to all branch teller virtual desktops. Pilot on two branches first, then wave rollout.",
          project: "Cybersecurity Uplift", category: "Cybersecurity",
          assignee: "Priya Nair", priority: "Critical", dueDate: daysFromToday(-2), status: "In Progress"
        },
        {
          title: "UAT sign-off for mobile onboarding release 4.2",
          description: "Collect business sign-off from Retail Digital for the onboarding flow changes and KYC document capture.",
          project: "Digital Channels", category: "Application Development",
          assignee: "Wei Ling Chua", priority: "High", dueDate: daysFromToday(5), status: "Blocked"
        },
        {
          title: "Renew SIEM licence with vendor",
          description: "Commercial renewal for the SIEM platform. Awaiting Procurement approval on the revised quote.",
          project: "Vendor Management", category: "Vendor",
          assignee: "Daniel Lim", priority: "Medium", dueDate: daysFromToday(-6), status: "Blocked"
        },
        {
          title: "Design data lineage model for regulatory reports",
          description: "Define lineage capture from source systems to MAS 610 reporting datasets in the data catalogue.",
          project: "Data & Analytics", category: "Data",
          assignee: "Aisha Rahman", priority: "Medium", dueDate: daysFromToday(30), status: "Backlog"
        },
        {
          title: "Core banking batch window performance review",
          description: "Profile end-of-day batch jobs and propose reordering to reclaim 40 minutes in the overnight window.",
          project: "Core Banking Upgrade", category: "Application Development",
          assignee: "Marcus Tan", priority: "Low", dueDate: daysFromToday(45), status: "Backlog"
        },
        {
          title: "Quarterly access recertification for privileged accounts",
          description: "Run the Q3 privileged access review and evidence pack for Internal Audit.",
          project: "Cybersecurity Uplift", category: "Compliance",
          assignee: "Priya Nair", priority: "High", dueDate: daysFromToday(-10), status: "Done"
        },
        {
          title: "Decommission legacy reporting SFTP server",
          description: "Confirm all downstream consumers migrated to the managed file transfer platform, then retire the host.",
          project: "Infrastructure & Cloud", category: "Infrastructure",
          assignee: "Daniel Lim", priority: "Low", dueDate: daysFromToday(-14), status: "Done"
        }
      ];
      state.tasks = seed.map(t => ({ id: generateTaskId(), ...t }));
    }

    /* ==========================================================
       RENDERING — everything re-renders from state.
       ========================================================== */

    /** Apply current filters to state.tasks (pure, client-side). */
    function applyFilters() {
      const { project, assignee, priority } = state.filters;
      const needle = assignee.trim().toLowerCase();
      return state.tasks.filter(t =>
        (!project || t.project === project) &&
        (!priority || t.priority === priority) &&
        (!needle || t.assignee.toLowerCase().includes(needle))
      );
    }

    /** Build the HTML string for one task card. All user text is escaped. */
    function renderCard(task) {
      const overdue = isOverdue(task);
      const confirming = state.pendingDeleteId === task.id;

      const moveOptions = STATUSES
        .filter(s => s !== task.status)
        .map(s => `<option value="${escapeHtml(s)}">→ ${escapeHtml(s)}</option>`)
        .join("");

      const footer = confirming
        ? `<div class="delete-confirm" role="group" aria-label="Confirm delete ${escapeHtml(task.id)}">
             <span>Delete?</span>
             <button type="button" class="btn btn-danger btn-sm" data-action="confirm-delete" data-id="${escapeHtml(task.id)}">Yes</button>
             <button type="button" class="btn btn-secondary btn-sm" data-action="cancel-delete" data-id="${escapeHtml(task.id)}">No</button>
           </div>`
        : `<div class="card-footer">
             <label class="visually-hidden" for="move-${escapeHtml(task.id)}">Move ${escapeHtml(task.id)} to column</label>
             <select class="move-select" id="move-${escapeHtml(task.id)}" data-action="move" data-id="${escapeHtml(task.id)}">
               <option value="">Move ▸</option>
               ${moveOptions}
             </select>
             <button type="button" class="btn-icon" data-action="delete" data-id="${escapeHtml(task.id)}"
                     aria-label="Delete task ${escapeHtml(task.id)}">${ICONS.close}</button>
           </div>`;

      return `
        <article class="card" draggable="true" data-id="${escapeHtml(task.id)}" data-priority="${escapeHtml(task.priority)}"
                 aria-label="${escapeHtml(task.id)}: ${escapeHtml(task.title)}">
          <div class="card-top">
            <span class="card-id">${escapeHtml(task.id)}</span>
            <span class="pill pill-priority" data-priority="${escapeHtml(task.priority)}">${escapeHtml(task.priority)}</span>
          </div>
          <h3 class="card-title">${escapeHtml(task.title)}</h3>
          <div class="card-project">${escapeHtml(task.project)}</div>
          ${task.description ? `<p class="card-desc">${escapeHtml(task.description)}</p>` : ""}
          <div class="card-tags">
            <span class="pill pill-category">${escapeHtml(task.category)}</span>
            ${overdue ? `<span class="pill pill-overdue">Overdue</span>` : ""}
          </div>
          <div class="card-meta">
            <span class="meta-item">
              <span class="avatar" data-tone="${avatarTone(task.assignee)}" aria-hidden="true">${escapeHtml(initials(task.assignee))}</span>
              <span>${escapeHtml(task.assignee)}</span>
            </span>
            <span class="meta-item ${overdue ? "overdue-date" : ""}">${ICONS.calendar}<span>Due ${escapeHtml(formatDate(task.dueDate))}</span></span>
          </div>
          ${footer}
        </article>`;
    }

    /** Re-render the four columns from state (filters applied). */
    function renderBoard() {
      const board = document.getElementById("board");
      const visible = applyFilters();

      board.innerHTML = STATUSES.map(status => {
        const tasks = visible.filter(t => t.status === status);
        const cards = tasks.length
          ? tasks.map(renderCard).join("")
          : `<div class="column-empty">No tasks</div>`;
        return `
          <section class="column" data-status="${escapeHtml(status)}" aria-labelledby="col-${escapeHtml(status).replace(/\s+/g, "-")}">
            <header class="column-header">
              <div>
                <div class="column-title" id="col-${escapeHtml(status).replace(/\s+/g, "-")}">
                  <span class="column-dot" data-status="${escapeHtml(status)}" aria-hidden="true"></span>
                  ${escapeHtml(status)}
                </div>
                <div class="column-meaning">${escapeHtml(STATUS_MEANING[status])}</div>
              </div>
              <span class="count-badge" aria-label="${tasks.length} tasks">${tasks.length}</span>
            </header>
            <div class="column-body">${cards}</div>
          </section>`;
      }).join("");

      renderSummary();
      renderFilterCount(visible.length);
    }

    /** Header summary strip: total, per-status, overdue — always over ALL tasks. */
    function renderSummary() {
      const strip = document.getElementById("summaryStrip");
      const total = state.tasks.length;
      const overdue = state.tasks.filter(isOverdue).length;
      const perStatus = STATUSES.map(s => ({
        label: s, value: state.tasks.filter(t => t.status === s).length
      }));

      const stats = [{ label: "Total", value: total }, ...perStatus, { label: "Overdue", value: overdue, cls: "stat-overdue" }];
      strip.innerHTML = stats.map(s => `
        <div class="stat ${s.cls || ""}" data-stat="${escapeHtml(s.label)}">
          <span class="stat-label">${escapeHtml(s.label)}</span>
          <span class="stat-value">${s.value}</span>
        </div>`).join("");
    }

    function renderFilterCount(visibleCount) {
      const el = document.getElementById("filterCount");
      const total = state.tasks.length;
      const active = state.filters.project || state.filters.assignee.trim() || state.filters.priority;
      el.textContent = active ? `Showing ${visibleCount} of ${total}` : "";
    }

    /** Populate <select> elements from the static option lists. */
    function populateSelect(el, options, { placeholder = null, selected = null } = {}) {
      const opts = [];
      if (placeholder !== null) opts.push(`<option value="">${escapeHtml(placeholder)}</option>`);
      options.forEach(o => {
        opts.push(`<option value="${escapeHtml(o)}" ${o === selected ? "selected" : ""}>${escapeHtml(o)}</option>`);
      });
      el.innerHTML = opts.join("");
    }

    /* ==========================================================
       STATE MUTATIONS — each one re-renders.
       ========================================================== */

    /** Add a validated task object to state and re-render. Returns the task. */
    function addTask(fields) {
      const task = {
        id: generateTaskId(),
        title: fields.title,
        description: fields.description,
        project: fields.project,
        category: fields.category,
        assignee: fields.assignee,
        priority: fields.priority,
        dueDate: fields.dueDate,
        status: fields.status
      };
      state.tasks.push(task);
      renderBoard();
      return task;
    }

    /** Change a task's status (column). */
    function moveTask(id, newStatus) {
      const task = findTask(id);
      if (!task || !STATUSES.includes(newStatus) || task.status === newStatus) return;
      task.status = newStatus;
      renderBoard();
      showToast(`${task.id} moved to ${newStatus}`, "info");
    }

    /** Remove a task from the array. */
    function deleteTask(id) {
      const idx = state.tasks.findIndex(t => t.id === id);
      if (idx === -1) return;
      const [removed] = state.tasks.splice(idx, 1);
      state.pendingDeleteId = null;
      renderBoard();
      showToast(`${removed.id} deleted`, "info");
    }

    /* ==========================================================
       TOASTS — transient, non-blocking, announced via aria-live.
       ========================================================== */
    function showToast(message, type = "info") {
      const region = document.getElementById("toastRegion");
      const toast = document.createElement("div");
      toast.className = `toast toast-${type}`;
      const icon = type === "success" ? ICONS.check : (type === "warning" || type === "error") ? ICONS.warn : ICONS.info;
      toast.innerHTML = `${icon}<span></span>`;
      toast.querySelector("span").textContent = message; // textContent: no HTML injection
      region.appendChild(toast);
      setTimeout(() => {
        toast.classList.add("leaving");
        setTimeout(() => toast.remove(), 220);
      }, TOAST_MS);
    }

    /* ==========================================================
       FORMSUBMIT — AJAX JSON endpoint. Failure never breaks the board.
       ========================================================== */
    async function notifyNewTask(task) {
      const res = await fetch(FORMSUBMIT_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json", Accept: "application/json" },
        body: JSON.stringify({
          _subject: `[UOB IT PMO] New task ${task.id}: ${task.title}`,
          _template: "table",
          _captcha: "false",
          "Task ID": task.id,
          Title: task.title,
          Description: task.description,
          Project: task.project,
          Category: task.category,
          Assignee: task.assignee,
          Priority: task.priority,
          "Due Date": task.dueDate,
          Status: task.status,
          "Submitted At": new Date().toISOString()
        })
      });
      if (!res.ok) throw new Error(`FormSubmit failed: ${res.status}`);
      return res.json();
    }

    /* ==========================================================
       ADD TASK FORM — validation, optimistic submit, modal control
       ========================================================== */
    const form = {
      root: null, backdrop: null, submitBtn: null,
      fields: {}, errors: {}
    };
    let lastFocusedBeforeModal = null;

    function initForm() {
      form.root = document.getElementById("addTaskForm");
      form.backdrop = document.getElementById("modalBackdrop");
      form.submitBtn = document.getElementById("submitAddTask");

      ["title", "description", "project", "category", "assignee", "priority", "dueDate", "status"].forEach(name => {
        const cap = name.charAt(0).toUpperCase() + name.slice(1);
        form.fields[name] = document.getElementById("f" + cap);
        form.errors[name] = document.getElementById("e" + cap);
      });

      populateSelect(form.fields.project, PROJECTS);
      populateSelect(form.fields.category, CATEGORIES);
      populateSelect(form.fields.priority, PRIORITIES, { selected: "Medium" });
      populateSelect(form.fields.status, STATUSES, { selected: "Backlog" });
      form.fields.dueDate.min = todayIso();

      document.getElementById("openAddTask").addEventListener("click", openModal);
      document.getElementById("closeAddTask").addEventListener("click", closeModal);
      document.getElementById("cancelAddTask").addEventListener("click", closeModal);
      form.backdrop.addEventListener("click", e => { if (e.target === form.backdrop) closeModal(); });
      document.addEventListener("keydown", e => {
        if (e.key === "Escape" && !form.backdrop.hidden) closeModal();
      });

      // Clear a field's error as soon as the user edits it
      Object.keys(form.fields).forEach(name => {
        form.fields[name].addEventListener("input", () => setFieldError(name, ""));
      });

      form.root.addEventListener("submit", handleSubmit);
    }

    function openModal() {
      lastFocusedBeforeModal = document.activeElement;
      resetForm();
      form.backdrop.hidden = false;
      form.fields.title.focus();
    }

    function closeModal() {
      form.backdrop.hidden = true;
      if (lastFocusedBeforeModal && typeof lastFocusedBeforeModal.focus === "function") {
        lastFocusedBeforeModal.focus();
      }
    }

    function resetForm() {
      form.root.reset();
      form.fields.priority.value = "Medium";
      form.fields.status.value = "Backlog";
      form.fields.dueDate.min = todayIso();
      Object.keys(form.errors).forEach(name => setFieldError(name, ""));
    }

    function setFieldError(name, message) {
      const wrapper = form.fields[name].closest(".field");
      form.errors[name].textContent = message;
      form.fields[name].setAttribute("aria-invalid", message ? "true" : "false");
      wrapper.classList.toggle("invalid", Boolean(message));
    }

    /** Read + trim form values. */
    function readForm() {
      return {
        title: form.fields.title.value.trim(),
        description: form.fields.description.value.trim(),
        project: form.fields.project.value,
        category: form.fields.category.value,
        assignee: form.fields.assignee.value.trim(),
        priority: form.fields.priority.value,
        dueDate: form.fields.dueDate.value,
        status: form.fields.status.value
      };
    }

    /** Client-side validation. Returns { valid, errors: {field: message} }. */
    function validateForm(values) {
      const errors = {};
      if (!values.title) errors.title = "Task title is required.";
      else if (values.title.length > TITLE_MAX) errors.title = `Title must be ${TITLE_MAX} characters or fewer.`;

      if (values.description.length > DESC_MAX) errors.description = `Description must be ${DESC_MAX} characters or fewer.`;

      if (!PROJECTS.includes(values.project)) errors.project = "Select a project / workstream.";
      if (!CATEGORIES.includes(values.category)) errors.category = "Select a category.";
      if (!values.assignee) errors.assignee = "Assignee is required.";
      if (!PRIORITIES.includes(values.priority)) errors.priority = "Select a priority.";

      if (!values.dueDate) errors.dueDate = "Due date is required.";
      else if (!/^\d{4}-\d{2}-\d{2}$/.test(values.dueDate)) errors.dueDate = "Enter a valid date.";
      else if (values.dueDate < todayIso()) errors.dueDate = "Due date must not be in the past.";

      if (!STATUSES.includes(values.status)) errors.status = "Select a status.";

      return { valid: Object.keys(errors).length === 0, errors };
    }

    async function handleSubmit(event) {
      event.preventDefault();
      const values = readForm();
      const { valid, errors } = validateForm(values);

      Object.keys(form.fields).forEach(name => setFieldError(name, errors[name] || ""));
      if (!valid) {
        const firstBad = Object.keys(form.fields).find(name => errors[name]);
        if (firstBad) form.fields[firstBad].focus();
        return;
      }

      // Optimistic UI: card appears immediately; email goes out in parallel.
      const task = addTask(values);
      showToast(`${task.id} added to ${task.status}`, "success");

      form.submitBtn.disabled = true;
      const originalLabel = form.submitBtn.textContent;
      form.submitBtn.textContent = "Sending…";

      try {
        await notifyNewTask(task);
        showToast(`Email notification sent for ${task.id}`, "success");
      } catch (err) {
        // Non-blocking: the card stays on the board.
        showToast("Card added locally — email notification failed", "warning");
      } finally {
        form.submitBtn.disabled = false;
        form.submitBtn.textContent = originalLabel;
      }

      resetForm();
      closeModal();
    }

    /* ==========================================================
       BOARD INTERACTIONS — event delegation on #board
       (clicks, Move ▸ select, native HTML5 drag & drop)
       ========================================================== */
    function initBoardEvents() {
      const board = document.getElementById("board");

      // Clicks: delete / confirm / cancel
      board.addEventListener("click", e => {
        const btn = e.target.closest("[data-action]");
        if (!btn || btn.tagName === "SELECT") return;
        const id = btn.dataset.id;
        switch (btn.dataset.action) {
          case "delete":
            state.pendingDeleteId = id;
            renderBoard();
            board.querySelector(`[data-action="confirm-delete"][data-id="${CSS.escape(id)}"]`)?.focus();
            break;
          case "confirm-delete":
            deleteTask(id);
            break;
          case "cancel-delete":
            state.pendingDeleteId = null;
            renderBoard();
            board.querySelector(`[data-action="delete"][data-id="${CSS.escape(id)}"]`)?.focus();
            break;
        }
      });

      // Keyboard fallback: "Move ▸" select
      board.addEventListener("change", e => {
        const sel = e.target.closest('select[data-action="move"]');
        if (!sel || !sel.value) return;
        const id = sel.dataset.id;
        const target = sel.value;
        moveTask(id, target);
        // Keep keyboard focus on the moved card's control after re-render
        board.querySelector(`#move-${CSS.escape(id)}`)?.focus();
      });

      // Native HTML5 Drag and Drop
      let draggedId = null;

      board.addEventListener("dragstart", e => {
        const card = e.target.closest(".card");
        if (!card) return;
        draggedId = card.dataset.id;
        e.dataTransfer.effectAllowed = "move";
        e.dataTransfer.setData("text/plain", draggedId);
        card.classList.add("dragging");
      });

      board.addEventListener("dragend", e => {
        const card = e.target.closest(".card");
        if (card) card.classList.remove("dragging");
        draggedId = null;
        board.querySelectorAll(".column.drop-target").forEach(c => c.classList.remove("drop-target"));
      });

      board.addEventListener("dragover", e => {
        const column = e.target.closest(".column");
        if (!column) return;
        e.preventDefault(); // required to allow dropping
        e.dataTransfer.dropEffect = "move";
        board.querySelectorAll(".column.drop-target").forEach(c => { if (c !== column) c.classList.remove("drop-target"); });
        column.classList.add("drop-target");
      });

      board.addEventListener("dragleave", e => {
        const column = e.target.closest(".column");
        if (!column) return;
        // Only clear when actually leaving the column (not moving between its children)
        if (!column.contains(e.relatedTarget)) column.classList.remove("drop-target");
      });

      board.addEventListener("drop", e => {
        const column = e.target.closest(".column");
        if (!column) return;
        e.preventDefault();
        const id = e.dataTransfer.getData("text/plain") || draggedId;
        column.classList.remove("drop-target");
        if (id) moveTask(id, column.dataset.status);
      });
    }

    /* ==========================================================
       FILTER BAR
       ========================================================== */
    function initFilters() {
      const project = document.getElementById("filterProject");
      const assignee = document.getElementById("filterAssignee");
      const priority = document.getElementById("filterPriority");

      populateSelect(project, PROJECTS, { placeholder: "All projects" });
      populateSelect(priority, PRIORITIES, { placeholder: "All priorities" });

      project.addEventListener("change", () => { state.filters.project = project.value; renderBoard(); });
      priority.addEventListener("change", () => { state.filters.priority = priority.value; renderBoard(); });
      assignee.addEventListener("input", () => { state.filters.assignee = assignee.value; renderBoard(); });

      document.getElementById("clearFilters").addEventListener("click", () => {
        state.filters = { project: "", assignee: "", priority: "" };
        project.value = ""; priority.value = ""; assignee.value = "";
        renderBoard();
        assignee.focus();
      });
    }

    /* ==========================================================
       BOOT
       ========================================================== */
    function init() {
      seedTasks();
      initFilters();
      initForm();
      initBoardEvents();
      renderBoard();
    }

    document.addEventListener("DOMContentLoaded", init);
  })();
  </script>
</body>
</html>
